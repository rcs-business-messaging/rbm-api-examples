<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save to Wallet</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .wallet-container {
            max-width: 500px;
            margin: 50px auto;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .btn-wallet {
            padding: 12px 20px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-radius: 8px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-google {
            background-color: #000000;
            color: #ffffff;
            border: none;
        }
        .btn-google:hover {
            background-color: #333333;
            color: #ffffff;
        }
        .btn-apple {
            background-color: #000000;
            color: #ffffff;
            border: none;
        }
        .btn-apple:hover {
            background-color: #333333;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wallet-container">
            <i class="fa-solid fa-wallet fa-4x mb-3 text-primary"></i>
            <h2 class="mb-3">Save Your Pass</h2>
            <p class="text-muted mb-4">Please open this link on your mobile device to add the pass directly, or select your platform below to download it manually.</p>
            
            <a href="/add-to-wallet?force=android" class="btn btn-wallet btn-google">
                <i class="fa-brands fa-google"></i> Save to Google Wallet
            </a>
            <a href="/add-to-wallet?force=apple" class="btn btn-wallet btn-apple">
                <i class="fa-brands fa-apple"></i> Download Apple Wallet Pass
            </a>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
